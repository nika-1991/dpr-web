# Render.com Blueprint.
# მონაცემების შესანახად: Starter გეგმა + Disk (Mount Path /var/data) + DATA_DIR=/var/data.
# უფასო გეგმაზე დისკი დროებითია: გადატვირთვისას ან ახალი ვერსიისას ბაზა და ფოტოები იშლება.
services:
  - type: web
    name: dpr-web
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_SAMPLE
        value: "true"
