# Render.com Blueprint: უფასო სატესტო სერვერი.
# ყურადღება: უფასო გეგმაზე დისკი დროებითია. სერვისის გადატვირთვისას
# ან ახალი ვერსიის ატვირთვისას ბაზა და ფოტოები იშლება.
services:
  - type: web
    name: dpr-web
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_SAMPLE
        value: "true"
